<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Pomodoro Таймер</h1>

        <div id="mode" class="work">Работа</div>

        <div id="time">25:00</div>

        <div class="buttons">
            <button id="start">Старт</button>
            <button id="reset">Сброс</button>
        </div>

        <div class="stats">
            <p>Помидоры: <span id="count">0</span></p>
            <p>Всего минут: <span id="total">0</span></p>
        </div>

        <div class="historyBlock">
            <h3>История</h3>
            <ul id="history"></ul>
        </div>

        <audio id="breakSound" src="sound.mp3"></audio>
    </div>

    <script src="script.js"></script>
</body>

</html>
